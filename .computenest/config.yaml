Service:
  RegionId: cn-hangzhou
  DeployType: ros
  OperationMetadata:
    StatusOperationConfigs:
      - TemplateName: ECS单机版
        SupportOperations:
          - Start
          - Stop
          - Restart
    SupportBackup: true
    ModifyParametersConfig:
      - TemplateName: ECS单机版
        Operation:
          - Name: 变更ECS实例规格
            Description: 变更ECS实例规格
            Type: Custom
            Parameters:
              - EcsInstanceType
          - Name: 变更ECS实例密码
            Description: 变更ECS实例密码
            Type: Custom
            Parameters:
              - InstancePassword
  DeployMetadata:
    SupplierDeployMetadata:
      SupplierTemplateConfigs:
        - Name: ECS单机版
          Url: 'ros_templates/template.yaml'
          ArchitectureDiagramUrl: 'resources/architecture/architecture.jpg'
          AllowedRegions:
            - ap-southeast-1
      ArtifactRelation:
        ecs_image_AFFiNE:
          ArtifactId: ${Artifact.EcsImage.ArtifactId}
          ArtifactVersion: draft
    TemplateConfigs:
      - Name: ECS单机版
        Url: 'ros_templates/template.yaml'
        ArchitectureDiagramUrl: 'resources/architecture/architecture.jpg'
        AllowedRegions:
          - ap-southeast-1
  ServiceType: private
  ServiceInfo:
    # 英文版可以再配置Locale为en-US的服务信息
    - Locale: zh-CN
      ShortDescription: demo
      Image: 'resources/icons/service_logo.png'
Artifact:
  EcsImage:
    ArtifactType: EcsImage
    ArtifactName: ecs_image_AFFiNE
    Description: AFFiNE EcsImage
    SupportRegionIds:
        - ap-southeast-1
    ArtifactBuildProperty:
      CodeRepo:
        Platform: github
        Owner: JJGGu
        RepoName: JJGGu/AFFiNE
        Branch: canary
      RegionId: ap-southeast-1
      CommandType: RunShellScript
      SourceImageId: 
      CommandContent: |-
        mkdir -p /root/application
        mkdir -p "/root/application/.docker/selfhost"
        if [ -e "/root/code/.docker/selfhost/compose.yml" ]; then cp -r "/root/code/.docker/selfhost/compose.yml" "/root/application/.docker/selfhost/"; fi
        if [ -e "/root/code/.docker/selfhost/${UPLOAD_LOCATION}" ]; then cp -r "/root/code/.docker/selfhost/${UPLOAD_LOCATION}" "/root/application/.docker/selfhost/"; fi
        if [ -e "/root/code/.docker/selfhost/.env.example" ]; then cp -r "/root/code/.docker/selfhost/.env.example" "/root/application/.docker/selfhost/"; fi
        if [ -e "/root/code/.docker/selfhost/${DB_DATA_LOCATION}" ]; then cp -r "/root/code/.docker/selfhost/${DB_DATA_LOCATION}" "/root/application/.docker/selfhost/"; fi
        if [ -e "/root/code/.docker/selfhost/${CONFIG_LOCATION}" ]; then cp -r "/root/code/.docker/selfhost/${CONFIG_LOCATION}" "/root/application/.docker/selfhost/"; fi
        cd /root/application
        cp .docker/selfhost/.env.example .docker/selfhost/.env
        sed -i 's/pull_policy: always/pull_policy: if_not_present/g' .docker/selfhost/compose.yml
        docker compose -f .docker/selfhost/compose.yml build
        docker compose -f .docker/selfhost/compose.yml pull || true;